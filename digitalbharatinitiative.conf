# 1. Apex Domain (digitalbharatinitiative.tech) -> Custom 404
server {
    listen 80;
    listen [::]:80;
    server_name digitalbharatinitiative.tech www.digitalbharatinitiative.tech;

    # Allow Let's Encrypt SSL verification
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    root /var/www/digitalbharatinitiative;
    index index.html;

    error_page 404 /index.html;

    location / {
        return 404;
    }

    location = /index.html {
        internal;
    }
}

# 2. Subdomain: jankitraders.digitalbharatinitiative.tech
server {
    listen 80;
    listen [::]:80;
    server_name jankitraders.digitalbharatinitiative.tech;

    client_max_body_size 25M;

    # Allow Let's Encrypt SSL verification
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    root /var/www/Janki-Traders/Client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
